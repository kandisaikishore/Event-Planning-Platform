name: Repository Quality Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate README, Markdown files, and local links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          readme = root / "README.md"
          if not readme.is_file() or not readme.read_text(encoding="utf-8").strip():
              raise SystemExit("FAIL: README.md is missing or empty")

          markdown_files = [
              p for p in root.rglob("*.md")
              if not any(part in {".git", ".venv", "node_modules"} for part in p.parts)
          ]
          if not markdown_files:
              raise SystemExit("FAIL: no Markdown documentation found")

          failures = []
          link_pattern = re.compile(r"!?(?:\[[^\]]*\])\(([^)]+)\)")
          for doc in markdown_files:
              text = doc.read_text(encoding="utf-8")
              if not text.strip():
                  failures.append(f"{doc}: empty Markdown file")
                  continue
              for raw in link_pattern.findall(text):
                  target = raw.strip().split()[0].strip("<>")
                  parsed = urlsplit(target)
                  if parsed.scheme or target.startswith("#") or not parsed.path:
                      continue
                  local = (doc.parent / unquote(parsed.path)).resolve()
                  if local.is_dir():
                      exists = (local / "README.md").is_file() or (local / "index.md").is_file()
                  else:
                      exists = local.is_file()
                  if not exists:
                      failures.append(f"{doc}: broken local link -> {target}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(f"FAIL: {len(failures)} documentation issue(s)")
          print(f"PASS: validated {len(markdown_files)} Markdown files; all local file links resolve.")
          PY
